<svg xmlns="http://www.w3.org/2000/svg" width="840" height="566" viewBox="0 0 840 566" role="img" aria-labelledby="title desc">
<title id="title">skillswitch</title>
<desc id="desc">Switch coding-agent skill sets without deleting them. Basic management supports six CLI targets. Profiles, catalog and audit are Claude-only. Published CLI 0.2.0. Open the skillswitch repository. Static, reduced-motion version.</desc>
