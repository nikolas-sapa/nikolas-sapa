<text x="48" y="125" font-size="64" class="heading">skillswitch</text>
<text x="48" y="376" font-size="34" class="primary">Switch coding-agent skill sets</text>
<text x="48" y="420" font-size="34" class="primary">without deleting them.</text>
<text x="48" y="474" font-size="30" class="muted">Basic management: 6 CLI targets.</text>
