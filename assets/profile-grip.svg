<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" role="img" aria-labelledby="title desc">
<title id="title">Grip</title>
<desc id="desc">A CDP-native browser SDK for AI agents. Compact page snapshots. Typed error recovery. Published on PyPI. Open the Grip repository.</desc>
<defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#8f8f8f"/></pattern><pattern id="blue-grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#006bff"/></pattern><pattern id="silver-grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#ededed"/></pattern><clipPath id="illustration"><rect x="49" y="164" width="742" height="162"/></clipPath></defs>
<style>text{font-family:'Geist Sans',system-ui,sans-serif;font-weight:400}
.label{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Consolas,monospace;fill:#3291ff}
.muted{fill:#8f8f8f}
.primary{fill:#ededed}
.heading{fill:#ededed;font-weight:600;letter-spacing:-1.5px}
.motion{transform-box:view-box}
.drift{animation:drift 12s cubic-bezier(.45,0,.55,1) infinite}
.fold{animation:fold 10s cubic-bezier(.45,0,.55,1) infinite}
.component{animation:component 8s cubic-bezier(.16,1,.3,1) infinite}
.scan{animation:scan 10s cubic-bezier(.45,0,.55,1) infinite}
.packet{animation:packet 9s cubic-bezier(.4,0,.2,1) infinite}
.toggle{animation:toggle 8s cubic-bezier(.16,1,.3,1) infinite}
.paper{animation:paper 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes drift{0%,100%{transform:translate(-34px,0)}50%{transform:translate(46px,-9px)}}
@keyframes fold{0%,100%{transform:translate(-28px,4px)}50%{transform:translate(38px,-8px)}}
@keyframes component{0%,100%{transform:translate(0,-12px)}45%,65%{transform:translate(24px,6px)}}
@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(514px)}}
@keyframes packet{0%,100%{transform:translate(0,0)}32%{transform:translate(234px,-38px)}62%,78%{transform:translate(552px,-38px)}}
@keyframes toggle{0%,100%{transform:translateX(0)}40%,66%{transform:translateX(84px)}}
@keyframes paper{0%,100%{transform:translate(-26px,0)}50%{transform:translate(36px,-10px)}}
@media(prefers-reduced-motion:reduce){.motion{animation:none!important;transform:none!important}}
</style>
<rect width="840" height="580" fill="#0a0a0a"/>
<path d="M48 1H792" stroke="#2e2e2e"/>
<text x="48" y="50" font-size="30" class="label">02 / BROWSER TOOLS</text>
<text x="48" y="125" font-size="64" class="heading">Grip</text>
<text x="48" y="376" font-size="34" class="primary">A CDP-native browser SDK</text>
<text x="48" y="420" font-size="34" class="primary">for AI agents.</text>
<text x="48" y="468" font-size="32" class="muted">Compact page snapshots.</text>
<text x="48" y="508" font-size="32" class="muted">Typed error recovery.</text>
<text x="48" y="554" font-size="30" class="label">PUBLISHED ON PYPI</text>
<path d="M48 164H792V326H48ZM48 199H792" fill="none" stroke="#8f8f8f" stroke-width="1.25"/><path d="M64 180h7M82 180h7M100 180h7" stroke="#8f8f8f" stroke-width="3"/><g clip-path="url(#illustration)"><path d="M80 223h190M80 244h126M80 272h160M80 293h92M326 222v75M326 235h45M326 279h45M391 235h174M391 279h117M620 219v88M620 235h41M620 279h41M680 235h79M680 279h52" stroke="#2e2e2e" stroke-width="3" fill="none"/><path d="M317 226h18v18h-18zM317 270h18v18h-18zM611 226h18v18h-18zM611 270h18v18h-18z" fill="url(#grain)" stroke="#8f8f8f"/><g class="motion scan"><path d="M70 201h154v124H70Z" fill="url(#blue-grain)" opacity=".8"/><path d="M224 207v112M213 207h11M213 319h11" stroke="#006bff" stroke-width="2" fill="none"/></g></g>
<path d="M751 125l28-28M755 97h24v24" fill="none" stroke="#3291ff" stroke-width="2.5"/>
</svg>
