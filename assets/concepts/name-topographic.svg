  <title id="title">NIKOLAS SAPALIDIS — C / TOPOGRAPHIC TYPE</title>
  <desc id="desc">Large geometric vector letters rise from a layered blue topographic field. Nested organic contours and ordered-dither terrain move laterally behind and across the carved name. Reduced motion freezes the terrain with the full name visible.</desc>
