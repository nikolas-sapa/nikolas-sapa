.name{fill:#c8c8c8}
.big{fill:#ededed;font-weight:600}
.muted{fill:#8f8f8f}
circle.p{fill:#141414;stroke:#3f3f3f;stroke-width:1.5}
circle.f{fill:url(#blue-grain);stroke:#006bff;stroke-width:2}
</style>
