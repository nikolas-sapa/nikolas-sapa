<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
<title id="title">A map of the work</title>
<desc id="desc">Bubble map of all 25 projects; bubble size follows profile rank. Agent tools cluster: Grip, Toolfence, Agentic Pipeline, Branch AI, Helm, Skillswitch, NemoCascade, Branch Obsidian, pre-commit-deno. Apps cluster: ns-ui, FIREYE, Commitment Desk, Basis Terminal, Clientcast, Order Evidence, NeuroLens, Scope to Deposit, Release Memory, FieldQuest, Taste Concierge. Markets cluster: SAC Capital, Curb, x402 Radar. Research: Staleness. FIREYE marked top 4 at Gen AI Summit. Upstream ring: 35 merged PRs across 14 external repos.</desc>
<defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#8f8f8f"/></pattern><pattern id="blue-grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#006bff"/></pattern></defs>
<style>text{font-family:'Geist Sans',system-ui,sans-serif;font-weight:400}
