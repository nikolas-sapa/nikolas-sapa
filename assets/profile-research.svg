<svg xmlns="http://www.w3.org/2000/svg" width="840" height="626" viewBox="0 0 840 626" role="img" aria-labelledby="title desc">
<title id="title">When summaries go stale</title>
<desc id="desc">2,631 runs studying when stale summaries overrule fresh evidence. Templated provenance helped. Model-written compaction remained unresolved. Open the resumed-agent staleness research.</desc>
<defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#8f8f8f"/></pattern><pattern id="blue-grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#006bff"/></pattern><pattern id="silver-grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0h2v2H0zM4 4h2v2H4z" fill="#ededed"/></pattern><clipPath id="illustration"><rect x="40" y="160" width="760" height="177"/></clipPath></defs>
<style>text{font-family:'Geist Sans',system-ui,sans-serif;font-weight:400}
.label{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Consolas,monospace;fill:#3291ff}
.muted{fill:#8f8f8f}
.primary{fill:#ededed}
.heading{fill:#ededed;font-weight:600;letter-spacing:-1.5px}
.motion{transform-box:view-box}
.drift{animation:drift 12s cubic-bezier(.45,0,.55,1) infinite}
.fold{animation:fold 10s cubic-bezier(.45,0,.55,1) infinite}
.component{animation:component 8s cubic-bezier(.16,1,.3,1) infinite}
.scan{animation:scan 10s cubic-bezier(.45,0,.55,1) infinite}
.packet{animation:packet 9s cubic-bezier(.4,0,.2,1) infinite}
.toggle{animation:toggle 8s cubic-bezier(.16,1,.3,1) infinite}
.paper{animation:paper 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes drift{0%,100%{transform:translate(-34px,0)}50%{transform:translate(46px,-9px)}}
@keyframes fold{0%,100%{transform:translate(-28px,4px)}50%{transform:translate(38px,-8px)}}
@keyframes component{0%,100%{transform:translate(0,-12px)}45%,65%{transform:translate(24px,6px)}}
@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(514px)}}
@keyframes packet{0%,100%{transform:translate(0,0)}32%{transform:translate(234px,-38px)}62%,78%{transform:translate(552px,-38px)}}
@keyframes toggle{0%,100%{transform:translateX(0)}40%,66%{transform:translateX(84px)}}
@keyframes paper{0%,100%{transform:translate(-26px,0)}50%{transform:translate(8px,-10px)}}
@media(prefers-reduced-motion:reduce){.motion{animation:none!important;transform:none!important}}
</style>
<rect width="840" height="626" fill="#0a0a0a"/>
<path d="M48 1H792" stroke="#2e2e2e"/>
<text x="48" y="50" font-size="30" class="label">RESEARCH / RESUMED-AGENT STALENESS</text>
<text x="48" y="122" font-size="48" class="heading">When summaries go stale.</text>
<text x="48" y="390" font-size="34" class="primary">2,631 runs studying when stale</text>
<text x="48" y="434" font-size="34" class="primary">summaries overrule fresh evidence.</text>
<text x="48" y="496" font-size="32" class="muted">Templated provenance helped.</text>
<text x="48" y="538" font-size="32" class="muted">Model-written compaction remained</text>
<text x="48" y="580" font-size="32" class="muted">unresolved.</text>
